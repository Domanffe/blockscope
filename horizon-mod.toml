id = "blockscope"
name = "Blockscope"
version = "0.2.0"
description = "The block under your crosshair: its name, id, distance, and its icon, coordinates, reach and placement on its own settings page. A Jade-style tooltip for Horizon."
authors = ["Domanffe"]
# The Horizon mod API the SDK targets.
api = "0.1"
# client: runs in the player's game.
side = "client"
# What the mod may do, shown to players before they turn it on:
# game-read (the player and what the crosshair hits), render (draw on the HUD),
# recipes (the item table, for a block's name and icon), ui (its settings page
# in Options > Mods) and storage (the choice it keeps between games).
capabilities = ["game-read", "render", "recipes", "ui", "storage"]
experimental = ["render", "recipes", "ui"]
