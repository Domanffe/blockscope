id = "blockscope"
name = "Blockscope"
version = "0.1.0"
description = "The block under your crosshair: its name, id and distance, in a box beside the crosshair. A Jade-style tooltip for Horizon."
authors = ["Domanffe"]
# The Horizon mod API the SDK targets.
api = "0.1"
# client: runs in the player's game.
side = "client"
# What the mod may do, shown to players before they turn it on:
# game-read (the player and what the crosshair hits), render (draw on the HUD)
# and recipes (the item table, for a block's name in the player's language).
capabilities = ["game-read", "render", "recipes"]
experimental = ["render", "recipes"]
