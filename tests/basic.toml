# The mod owns no commands and draws nothing unless the crosshair is on a
# block; the headless harness has no blocks, so these steps check that it
# loads, ticks and stays quiet.

[[step]]
title-screen = true
expect.commands = []

[[step]]
player = { x = 0.5, y = 64.0, z = 0.5, yaw = 0.0, pitch = 0.0 }
ticks = 5
frames = 3
expect.chat = []
